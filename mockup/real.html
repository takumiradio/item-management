<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Inter:wght@300;500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;padding:0;font-family:'Noto Sans JP',sans-serif}
.frame{width:1280px;height:720px;position:relative;overflow:hidden}
.bg{position:absolute;inset:-10px;width:calc(100% + 20px);height:calc(100% + 20px);object-fit:cover;
  filter:contrast(1.08) saturate(1.12) brightness(.97)}
.grade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,170,90,.05),rgba(20,60,90,.08));mix-blend-mode:soft-light}
.vig{position:absolute;inset:0;background:radial-gradient(130% 110% at 50% 50%,transparent 55%,rgba(0,0,0,.45) 100%)}
.tl{position:absolute;left:0;top:0;width:760px;height:340px;background:radial-gradient(85% 85% at 0 0,rgba(0,0,0,.62),rgba(0,0,0,.25) 45%,transparent 75%)}
.bot{position:absolute;left:0;right:0;bottom:0;height:200px;background:linear-gradient(transparent,rgba(0,0,0,.65))}
/* A */
.a .title{position:absolute;left:56px;top:48px;color:#fff}
.a .no{font:500 14px 'Inter',sans-serif;letter-spacing:.34em;color:#D9FF4A;display:flex;align-items:center;gap:12px;font-weight:700;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.a .no:before{content:"";width:26px;height:2px;background:#D9FF4A}
.a .jp{font-weight:900;font-size:54px;letter-spacing:.06em;margin-top:8px;line-height:1.1;text-shadow:0 2px 20px rgba(0,0,0,.45)}
.a .en{font:700 15px 'Inter',sans-serif;letter-spacing:.55em;margin-top:10px;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.a .telop{position:absolute;left:0;right:0;bottom:44px;text-align:center;color:#fff;font-weight:700;font-size:38px;line-height:1.5;letter-spacing:.04em;
  text-shadow:0 0 3px rgba(0,0,0,.9),0 2px 10px rgba(0,0,0,.8),0 0 28px rgba(0,0,0,.5)}
.a .telop em{font-style:normal;color:#D9FF4A}
.a .bar{position:absolute;left:56px;right:56px;bottom:24px;height:3px;background:rgba(255,255,255,.22)}
.a .bar i{display:block;width:42%;height:100%;background:#D9FF4A}
/* B */
.b .title{position:absolute;left:0;top:44px}
.b .t1{display:inline-block;background:#D9FF4A;color:#0b0b0b;font-weight:900;font-size:48px;padding:10px 34px 10px 48px;letter-spacing:.05em;clip-path:polygon(0 0,100% 0,calc(100% - 20px) 100%,0 100%)}
.b .t2{display:flex;gap:14px;align-items:center;background:#0b0b0b;color:#fff;font:700 14px 'Inter',sans-serif;letter-spacing:.3em;padding:10px 30px 10px 48px;width:max-content;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.b .t2 span{color:#D9FF4A}
.b .telop{position:absolute;left:0;right:0;bottom:30px;text-align:center}
.b .telop div{display:inline-block;background:rgba(10,10,10,.72);backdrop-filter:blur(8px);color:#fff;font-weight:700;font-size:32px;line-height:1.4;padding:12px 38px;border-radius:14px;letter-spacing:.03em;border-left:5px solid #D9FF4A;white-space:nowrap}
.b .telop em{font-style:normal;background:linear-gradient(transparent 62%,rgba(217,255,74,.6) 62%)}
.b .rep{position:absolute;right:48px;top:44px;color:#fff;text-align:right;font:800 60px 'Inter',sans-serif;line-height:1;text-shadow:0 2px 16px rgba(0,0,0,.4)}
.b .rep small{display:block;font:800 13px 'Inter',sans-serif;text-shadow:0 1px 6px rgba(0,0,0,.8);letter-spacing:.3em;color:#D9FF4A;margin-bottom:6px}
.b .tr{position:absolute;right:0;top:0;width:360px;height:220px;background:radial-gradient(90% 90% at 100% 0,rgba(0,0,0,.6),transparent 70%)}
</style></head><body>

<div class="frame a" id="A">
 <img class="bg" src="frame.webp"><div class="grade"></div><div class="vig"></div><div class="tl"></div><div class="bot"></div>
 <div class="title"><div class="no">TRAINING 01</div><div class="jp">腕立て伏せ</div><div class="en">PUSH-UP</div></div>
 <div class="telop">頭からかかとまで<em>一直線</em>をキープ</div>

</div>

<div class="frame b" id="B">
 <img class="bg" src="frame.webp"><div class="grade"></div><div class="vig"></div><div class="tl"></div><div class="tr"></div><div class="bot"></div>
 <div class="title"><div class="t1">腕立て伏せ</div><br><div class="t2">PUSH-UP <span>/</span> CHEST · ARMS</div></div>
 <div class="rep"><small>REPS</small>08</div>
 <div class="telop"><div>頭からかかとまで<em>一直線</em>をキープ</div></div>
</div>

<div class="frame" id="O"><img class="bg" src="frame.webp" style="filter:none"></div>
</body></html>
