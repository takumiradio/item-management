<!doctype html><html><head><meta charset="utf-8">
<link href="node_modules/@fontsource/noto-sans-jp/700.css" rel="stylesheet">
<link href="node_modules/@fontsource/noto-sans-jp/900.css" rel="stylesheet">
<link href="node_modules/@fontsource/inter/500.css" rel="stylesheet">
<link href="node_modules/@fontsource/inter/700.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;width:1920px;height:1080px;overflow:hidden;font-family:'Noto Sans JP',sans-serif}
.layer{position:absolute;inset:0;display:none}
.tl{position:absolute;left:0;top:0;width:1140px;height:510px;background:radial-gradient(85% 85% at 0 0,rgba(0,0,0,.62),rgba(0,0,0,.25) 45%,transparent 75%)}
.bot{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.title{position:absolute;left:84px;top:72px;color:#fff}
.no{font:700 21px 'Inter',sans-serif;letter-spacing:.34em;color:#D9FF4A;display:flex;align-items:center;gap:18px;text-shadow:0 1px 10px rgba(0,0,0,.6)}
.no:before{content:"";width:39px;height:3px;background:#D9FF4A}
.jp{white-space:pre-line;font-weight:900;font-size:81px;letter-spacing:.06em;margin-top:12px;line-height:1.1;text-shadow:0 3px 30px rgba(0,0,0,.45)}
.en{font:700 22px 'Inter',sans-serif;letter-spacing:.55em;margin-top:15px;text-shadow:0 1px 10px rgba(0,0,0,.7)}
.telop{position:absolute;left:0;right:0;bottom:66px;text-align:center;color:#fff;font-weight:700;font-size:57px;line-height:1.5;letter-spacing:.04em;
  text-shadow:0 0 4px rgba(0,0,0,.9),0 3px 14px rgba(0,0,0,.8),0 0 40px rgba(0,0,0,.5)}
.telop em{font-style:normal;color:#D9FF4A}
</style></head><body>
<div class="layer" id="grad"><div class="tl"></div><div class="bot"></div></div>
<div class="layer" id="ttl"><div class="title"><div class="no" id="no"></div><div class="jp" id="jp"></div><div class="en" id="en"></div></div></div>
<div class="layer" id="tel"><div class="telop" id="telop"></div></div>
</body></html>
